# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: functions-hosted-skills-teams-helpdesk
metadata:
  template: functions-hosted-skills-teams-helpdesk@0.0.1-beta
services:
  api:
    project: ./src
    language: python
    host: function
hooks:
  # The Teams trigger config calls the function with the app's connector_extension
  # system key, which exists only after the code is deployed. The hook skips with a
  # clear message until the Teams connection is authorized and a channel is set.
  postdeploy:
    windows:
      shell: pwsh
      run: python ./scripts/postdeploy.py
      continueOnError: false
    posix:
      shell: sh
      run: python3 ./scripts/postdeploy.py
      continueOnError: false
